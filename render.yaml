services:
  - type: web
    name: bill-desk
    runtime: node
    plan: starter
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: HOSTNAME=0.0.0.0 PORT=$PORT npm run start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SHARE_SIGNING_SECRET
        generateValue: true
      - key: SOFTWARE_ADMIN_PASSWORD
        sync: false
      - key: AUTH_DATA_DIR
        value: /var/data/billdesk
    disk:
      name: bill-desk-auth-data
      mountPath: /var/data
      sizeGB: 1
